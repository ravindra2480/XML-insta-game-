name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Keystore and Environment
        run: |
          # Fix line endings and permissions for gradlew
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew

          # Decode or generate debug keystore if missing
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
          fi

          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating valid debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env files exist for Secrets Gradle plugin
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-artifacts/MysticQuest-debug.apk
            echo "APK ready at: build-artifacts/MysticQuest-debug.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MysticQuest-Android-APK
          path: build-artifacts/MysticQuest-debug.apk
          if-no-files-found: error
          retention-days: 30

