name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Keystore and Environment
        run: |
          # Make Gradle wrapper executable
          chmod +x ./gradlew

          # Decode debug keystore if base64 file exists and keystore is absent
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure .env exists
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/MysticQuest-debug.apk
            echo "APK successfully prepared: build-artifacts/MysticQuest-debug.apk"
          else
            echo "Error: app-debug.apk not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MysticQuest-Android-APK
          path: build-artifacts/MysticQuest-debug.apk
          retention-days: 30
